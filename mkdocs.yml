site_name: Project Territory Framework Docs
site_description: API reference for the Project Territory framework. Each export includes the arguments, the rejection cases, and an example.
docs_dir: content
site_dir: site

theme:
  name: material
  logo: assets/images/territory-crest.webp
  favicon: assets/images/territory-crest.webp
  palette:
    - scheme: territory
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: README.md
  - Tutorial: tutorial-crafting.md
  - fw_core: fw-core.md
  - fw_menu: fw-menu.md
  - fw_guide: fw-guide.md
  - fw_admin: fw-admin.md
  - fw_characters: fw-characters.md
  - fw_creator: fw-creator.md
  - fw_clothing: fw-clothing.md
  - fw_inventory: fw-inventory.md
  - fw_money: fw-money.md
  - fw_weapons: fw-weapons.md
  - fw_satchel: fw-satchel.md
  - fw_trade: fw-trade.md
  - vorp_lib: vorp-lib.md
  - Database: database.md

