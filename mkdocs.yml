site_name: Project Territory Framework Docs
site_description: API reference for the Project Territory framework. Each export includes the arguments, the rejection cases, and an example.
docs_dir: content
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - fenced_code
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: README.md
  - fw_core: fw-core.md
  - fw_menu: fw-menu.md
  - fw_guide: fw-guide.md
  - fw_admin: fw-admin.md
  - fw_characters: fw-characters.md
  - fw_creator: fw-creator.md
  - fw_clothing: fw-clothing.md
  - fw_inventory: fw-inventory.md
  - fw_money: fw-money.md
  - fw_weapons: fw-weapons.md
  - fw_satchel: fw-satchel.md
  - fw_trade: fw-trade.md
  - vorp_lib: vorp-lib.md
  - Database: database.md

